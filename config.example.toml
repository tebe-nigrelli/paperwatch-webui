[paths]
database = "paperwatch.db"
pdf_dir = "data/pdfs"
prompt = "prompts/analyze.txt"

[openalex]
api_key = "" # Prefer OPENALEX_API_KEY in the environment
base_url = "https://api.openalex.org"
timeout_seconds = 30

[arxiv]
enabled = true
base_url = "https://export.arxiv.org/api/query"
timeout_seconds = 30
min_interval_seconds = 3
title_match_threshold = 0.90

[fetch]
overlap_days = 30
initial_lookback_days = 365
max_papers_per_author = 500
download_pdfs = true
max_pdf_bytes = 50000000
max_pdf_chars = 2000000
retry_missing_pdf_days = 90

[llm]
provider = "ollama" # ollama | openai | codex | claude-code | none
model = "qwen3:8b"
base_url = "http://localhost:11434"
api_key = "" # Prefer OPENAI_API_KEY in the environment
timeout_seconds = 180
max_input_chars = 100000
context_window_tokens = 16384
analyze_abstracts = false
analyze_pdfs = false
pdf_analysis_strategy = "chunked" # auto | direct | chunked
prompt_version = "v2"
