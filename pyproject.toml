[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperwatch"
version = "0.9.7"
description = "Minimal daily paper tracker for selected authors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pypdf>=5,<7",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "beautifulsoup4>=4.12,<5",
  "python-multipart>=0.0.18,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
paperwatch = "paperwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperwatch = ["defaults/*.toml", "defaults/*.txt", "web_templates/*.html", "web_static/*"]

[tool.pytest.ini_options]
addopts = "-q --cov=paperwatch --cov-branch --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["paperwatch"]

[tool.coverage.report]
show_missing = true
skip_covered = false
